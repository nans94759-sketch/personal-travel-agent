<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>China Trip Planner</title>
<style>
  :root{--ink:#1a1a1a;--muted:#6b6b6b;--line:#e2e0da;--accent:#185FA5;--bg:#faf9f6;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 -apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:40px 24px 80px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:36px;flex-wrap:wrap}
  h1{font-size:26px;margin:0;font-weight:600;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted);font-size:13px}
  .lang{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .lang button{border:0;background:#fff;padding:6px 13px;font-size:13px;cursor:pointer;
    color:var(--muted);font-family:inherit}
  .lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:20px}
  .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;
    font-size:13.5px;cursor:pointer;color:var(--ink);transition:.12s;font-family:inherit}
  .chip:hover{border-color:#b9b6ad}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-top:18px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field span{font-size:12px;color:var(--muted)}
  input,select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;
    background:#fff;color:var(--ink);font-family:inherit}
  button.primary{padding:11px 22px;border:0;border-radius:8px;background:var(--accent);color:#fff;
    font-size:14.5px;cursor:pointer;font-family:inherit}
  button.primary:disabled{opacity:.45;cursor:default}
  .ghost{padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;
    font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .hint{color:var(--muted);font-size:12.5px;margin:14px 0 0}
  .summary{display:flex;flex-wrap:wrap;gap:28px;padding:0 0 18px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .summary div{font-size:12px;color:var(--muted)}
  .summary b{display:block;font-size:16px;font-weight:500;color:var(--ink);margin-top:3px}
  .leg{display:grid;grid-template-columns:88px 1fr auto auto;gap:14px;align-items:baseline;
    padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .leg .m{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
  .leg small{color:var(--muted);font-size:12.5px;display:block}
  .leg .d{color:var(--muted);font-size:13px;white-space:nowrap}
  a.book{font-size:12.5px;color:var(--accent);text-decoration:none;border:1px solid var(--accent);
    border-radius:6px;padding:5px 11px;white-space:nowrap}
  .day{padding:14px 0;border-bottom:1px solid var(--line)}
  .day .d{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .day h3{font-size:15.5px;margin:2px 0 8px;font-weight:500}
  .day h3 small{color:var(--muted);font-weight:400;font-size:13px}
  .item{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:4px 0}
  .item .t{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .item .x{font-size:14px}
  .item .x small{display:block;color:var(--muted);font-size:12.5px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .notice{background:#FAEEDA;border:1px solid #FAC775;border-radius:8px;padding:12px 14px;
    font-size:13px;color:#633806;margin:18px 0 0}
  footer{margin-top:36px;color:var(--muted);font-size:12px;line-height:1.7}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="brand">China Trip Planner</h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-zh" aria-pressed="false">中文</button>
    </div>
  </header>

  <div class="card">
    <p class="label" data-i18n="step1"></p>
    <div class="chips" id="chips"></div>
    <div class="row">
      <label class="field"><span data-i18n="add_city"></span>
        <select id="more"><option value="" data-i18n="choose"></option></select>
      </label>
    </div>

    <div class="row">
      <label class="field"><span data-i18n="arrival_date"></span><input type="date" id="start"></label>
      <label class="field"><span data-i18n="days_label"></span>
        <select id="days">
          <option>4</option><option>5</option><option>6</option><option selected>7</option>
          <option>8</option><option>10</option><option>12</option><option>14</option>
        </select>
      </label>
      <label class="field"><span data-i18n="pace"></span>
        <select id="pace">
          <option value="slow" data-i18n="pace_slow"></option>
          <option value="balanced" selected data-i18n="pace_balanced"></option>
          <option value="fast" data-i18n="pace_fast"></option>
        </select>
      </label>
      <button class="primary" id="go" disabled data-i18n="build"></button>
    </div>
    <p class="hint" id="hint"></p>
  </div>

  <div id="out" class="hidden"></div>

  <footer data-i18n="footer"></footer>
</div>

<script>
const state = { lang: "en", selected: [], cities: null, strings: {}, plan: null };

const $ = (id) => document.getElementById(id);
const t = (key) => state.strings[key] || key;
const cityName = (c) => (state.lang === "zh" ? c.zh : c.en);
const cityAlt = (c) => (state.lang === "zh" ? c.en : c.zh);

function applyStrings() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.dataset.i18n;
    if (state.strings[key]) el.textContent = state.strings[key];
  });
  document.documentElement.lang = state.strings.html_lang || state.lang;
  document.title = t("brand");
  $("lang-en").setAttribute("aria-pressed", state.lang === "en" ? "true" : "false");
  $("lang-zh").setAttribute("aria-pressed", state.lang === "zh" ? "true" : "false");
}

function chip(city) {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = cityName(city);
  b.dataset.key = city.key;
  b.setAttribute("aria-pressed", state.selected.includes(city.key) ? "true" : "false");
  b.onclick = () => toggle(city.key);
  return b;
}

function toggle(key) {
  const i = state.selected.indexOf(key);
  if (i >= 0) state.selected.splice(i, 1);
  else state.selected.push(key);
  renderChips();
  syncButton();
}

function renderChips() {
  const box = $("chips");
  box.innerHTML = "";
  const list = state.selected
    .map((k) => state.cities.all.find((c) => c.key === k))
    .filter(Boolean);
  const pool = [...list, ...state.cities.popular.filter((c) => !state.selected.includes(c.key))];
  pool.slice(0, 12).forEach((c) => box.appendChild(chip(c)));
}

function syncButton() {
  const ok = state.selected.length >= 2;
  $("go").disabled = !ok;
  if (ok) {
    const first = state.cities.all.find((c) => c.key === state.selected[0]);
    $("hint").textContent = t("hint_ready")
      .replace("{city}", cityName(first))
      .replace("{n}", state.selected.length);
  } else {
    $("hint").textContent = t("hint_need_two");
  }
}

async function loadCities() {
  const res = await fetch(`/api/inbound/cities?lang=${state.lang}`);
  state.cities = await res.json();
  state.strings = state.cities.strings || {};
  applyStrings();

  const more = $("more");
  more.innerHTML = `<option value="">${t("choose")}</option>`;
  state.cities.all.forEach((c) => {
    const o = document.createElement("option");
    o.value = c.key;
    o.textContent = `${cityName(c)} · ${cityAlt(c)} — ${c.region}`;
    more.appendChild(o);
  });
  more.onchange = () => {
    if (!more.value) return;
    if (!state.selected.includes(more.value)) state.selected.push(more.value);
    more.value = "";
    renderChips();
    syncButton();
  };
  renderChips();
  syncButton();
}

function fmt(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  if (state.lang === "zh") {
    if (h && mm) return `${h} 小时 ${mm} 分`;
    if (h) return `${h} 小时`;
    return `${mm} 分钟`;
  }
  return h ? `${h}h${String(mm).padStart(2, "0")}` : `${mm}min`;
}

function renderPlan(plan) {
  state.plan = plan;
  const out = $("out");
  if (!plan.ok) {
    out.className = "";
    out.innerHTML = `<div class="card"><p>${plan.error || "—"}</p></div>`;
    return;
  }
  const legs = plan.legs.map((l) => `
    <div class="leg">
      <div class="m">${l.mode === "train" ? (state.lang === "zh" ? "高铁" : "train") : (state.lang === "zh" ? "航班" : "flight")}</div>
      <div>${l.from} → ${l.to}<small>${l.detail} · ${l.indicative ? t("estimated") : t("typ")}</small></div>
      <div class="d">${fmt(l.duration_min)}</div>
      ${l.booking_url
        ? `<a class="book" href="${l.booking_url}" target="_blank" rel="nofollow sponsored">${t("book")}</a>`
        : `<span class="d">—</span>`}
    </div>`).join("");

  const days = plan.days.map((d) => `
    <div class="day">
      <div class="d">${d.date}</div>
      <h3>${d.city} <small>${state.lang === "zh" ? d.city_en : d.city_zh}</small></h3>
      ${d.items.map((i) => `
        <div class="item"><div class="t">${i.time}</div>
        <div class="x">${i.title}<small>${i.detail}</small></div></div>`).join("")}
    </div>`).join("");

  const warn = plan.affiliate_ready ? "" : `<div class="notice">${t("no_affiliate")}</div>`;

  out.className = "";
  out.innerHTML = `
    <div class="card">
      <h2 style="font-size:19px;margin:0 0 14px;font-weight:600">${plan.title}</h2>
      <div class="summary">
        <div>${t("meta_dates")}<b>${plan.start} → ${plan.end}</b></div>
        <div>${t("meta_distance")}<b>${plan.total_distance_km.toLocaleString()} km</b></div>
        <div>${t("meta_stops")}<b>${plan.cities.length}</b></div>
      </div>
      ${warn}
      <p class="label" style="margin-top:18px">${t("getting_between")}</p>
      ${legs}
      <p class="label" style="margin-top:22px">${t("day_by_day")}</p>
      ${days}
      <div class="actions">
        <button class="ghost" id="pdf">${t("open_print")}</button>
        <button class="ghost" id="ics">${t("download_ics")}</button>
      </div>
    </div>`;

  $("pdf").onclick = () => {
    const q = new URLSearchParams({
      cities: state.selected.join(","),
      start: plan.start,
      days: plan.days.length,
      pace: plan.pace,
      lang: state.lang,
    });
    window.open(`/api/inbound/print?${q}`, "_blank");
  };
  $("ics").onclick = () => downloadIcs(plan);
}

async function downloadIcs(plan) {
  const res = await fetch("/api/export/ics", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ itinerary: plan }),
  });
  const text = await res.text();
  const url = URL.createObjectURL(new Blob([text], { type: "text/calendar" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "china-itinerary.ics";
  a.click();
  URL.revokeObjectURL(url);
}

async function build() {
  $("go").disabled = true;
  $("go").textContent = t("building");
  try {
    const res = await fetch("/api/inbound/plan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cities: state.selected,
        start: $("start").value,
        days: Number($("days").value),
        pace: $("pace").value,
        lang: state.lang,
      }),
    });
    renderPlan(await res.json());
    $("out").scrollIntoView({ behavior: "smooth", block: "start" });
  } finally {
    $("go").textContent = t("build");
    syncButton();
  }
}

$("go").onclick = build;

async function setLang(lang) {
  if (state.lang === lang) return;
  state.lang = lang;
  await loadCities();
  if (state.plan && state.plan.ok) await build();
}

$("lang-en").onclick = () => setLang("en");
$("lang-zh").onclick = () => setLang("zh");

const d = new Date();
d.setDate(d.getDate() + 30);
$("start").value = d.toISOString().slice(0, 10);
loadCities();
</script>
</body>
</html>
