<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>China Trip Planner</title>
<style>
  :root{
    --ink:#1c1c1e;--muted:#6b6f76;--line:#e6e3dc;--accent:#185FA5;--accent-soft:#eaf1f8;
    --bg:#f6f5f1;--card:#fff;--ok:#2e7d50;--shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.05)
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.6 -apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",Arial,sans-serif}
  .wrap{max-width:940px;margin:0 auto;padding:28px 22px 80px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:-.01em}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
  .lang button{border:0;background:#fff;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit}
  .lang button[aria-pressed="true"]{background:var(--accent);color:#fff}

  .hero{background:linear-gradient(135deg,#1c3f63,#185FA5);color:#fff;border-radius:16px;padding:30px 30px 26px;margin-bottom:22px;box-shadow:var(--shadow)}
  .hero h1{margin:0 0 8px;font-size:28px;font-weight:650;letter-spacing:-.02em}
  .hero p{margin:0;max-width:620px;font-size:15.5px;color:#dfeaf5}
  .hero .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .hero .tag{font-size:12.5px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:4px 11px;border-radius:999px;color:#eaf2fb}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
  .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-size:14px;cursor:pointer;color:var(--ink);transition:.12s;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .chip:hover{border-color:#b9b6ad}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .x{font-size:13px;opacity:.7;line-height:1}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-top:6px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field span{font-size:12px;color:var(--muted)}
  input,select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit}
  .grow{flex:1;min-width:180px}
  button.primary{padding:11px 22px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:14.5px;cursor:pointer;font-family:inherit;font-weight:550;transition:.12s}
  button.primary:hover{filter:brightness(1.06)}
  button.primary:disabled{opacity:.45;cursor:default}
  .ghost{padding:9px 16px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .ghost:hover{border-color:#b9b6ad}
  .hint{color:var(--muted);font-size:12.5px;margin:14px 0 0}

  .loading{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:14px;padding:30px 4px}
  .spin{width:22px;height:22px;border:3px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .result h2{font-size:19px;margin:0 0 4px;font-weight:600}
  .summary{display:flex;flex-wrap:wrap;gap:10px 26px;padding:14px 0 16px;border-bottom:1px solid var(--line)}
  .summary div{font-size:12px;color:var(--muted)}
  .summary b{display:block;font-size:15.5px;font-weight:550;color:var(--ink);margin-top:2px}
  .summary .tt{color:var(--accent)}

  .legs{margin:6px 0 4px}
  .leg{display:grid;grid-template-columns:74px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .leg .m{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:600}
  .leg small{color:var(--muted);font-size:12.5px;display:block}
  .leg .d{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
  a.book{font-size:12.5px;color:#fff;background:var(--accent);text-decoration:none;border-radius:7px;padding:6px 12px;white-space:nowrap;display:inline-block}
  a.book.ghost-l{background:#fff;color:var(--accent);border:1px solid var(--accent)}

  .day{padding:16px 0;border-bottom:1px solid var(--line)}
  .day .dh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
  .day .dh .dt{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .day .dh .ct{font-size:16px;font-weight:550}
  .day .dh .ct small{color:var(--muted);font-weight:400;font-size:13px;margin-left:5px}
  .day .dh a.hotel{margin-left:auto;font-size:12px;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:6px;padding:4px 10px}
  .item{display:grid;grid-template-columns:56px 14px 1fr;gap:12px;padding:5px 0;align-items:start}
  .item .t{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
  .item .rail{position:relative}
  .item .rail .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:block;margin:6px auto 0}
  .item .rail .bar{position:absolute;top:14px;bottom:-11px;left:50%;width:2px;background:var(--line);transform:translateX(-50%)}
  .item.last .rail .bar{display:none}
  .item .x{font-size:14px}
  .item .x small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}

  .note{font-size:12.5px;color:var(--muted);background:#f3f1ec;border-radius:8px;padding:10px 13px;margin:16px 0 0}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .hidden{display:none}
  footer{margin-top:34px;color:var(--muted);font-size:12px;line-height:1.7}

  @media (max-width: 680px) {
    .wrap{padding:16px 14px 56px}
    header{margin-bottom:14px}
    .hero{padding:20px 18px;border-radius:14px;margin-bottom:16px}
    .hero h1{font-size:22px}
    .hero p{font-size:14px}
    .card{padding:16px 14px;border-radius:12px;margin-bottom:14px}
    .chips{gap:6px}
    .chip{padding:7px 12px;font-size:13px}
    .row{gap:10px}
    .row .field{flex:1 1 calc(50% - 6px);min-width:120px}
    .row .field.grow{flex:1 1 100%}
    .row button.primary{width:100%;margin-top:4px}
    .summary{gap:10px 18px}
    .leg{grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0}
    .leg .m{grid-column:1 / -1}
    .day .dh{flex-wrap:wrap;gap:6px 10px}
    .day .dh a.hotel{margin-left:0}
    .item{grid-template-columns:48px 12px 1fr;gap:8px}
    .actions button,.actions a{flex:1 1 auto;text-align:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span><span data-i18n="brand">China Trip Planner</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-zh" aria-pressed="false">中文</button>
    </div>
  </header>

  <section class="hero">
    <h1 data-i18n="brand">China Trip Planner</h1>
    <p data-i18n="hero_lead"></p>
    <div class="tags">
      <span class="tag" data-i18n="tag_no_signup"></span>
      <span class="tag" data-i18n="tag_printable"></span>
      <span class="tag" data-i18n="tag_indicative"></span>
    </div>
  </section>

  <section class="card" id="builder">
    <p class="label" data-i18n="step1"></p>
    <div class="chips" id="chips"></div>
    <div class="row">
      <label class="field grow"><span data-i18n="add_city"></span>
        <select id="more"><option value="" data-i18n="choose"></option></select>
      </label>
    </div>
    <div class="row">
      <label class="field"><span data-i18n="arrival_date"></span><input type="date" id="start"></label>
      <label class="field"><span data-i18n="days_label"></span>
        <select id="days">
          <option>4</option><option>5</option><option>6</option><option selected>7</option>
          <option>8</option><option>10</option><option>12</option><option>14</option>
        </select>
      </label>
      <label class="field"><span data-i18n="pace"></span>
        <select id="pace">
          <option value="slow" data-i18n="pace_slow"></option>
          <option value="balanced" selected data-i18n="pace_balanced"></option>
          <option value="fast" data-i18n="pace_fast"></option>
        </select>
      </label>
      <button class="primary" id="go" data-i18n="build"></button>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <div id="out" class="hidden"></div>

  <footer data-i18n="footer"></footer>
</div>

<script>
const state = { lang: "en", selected: [], cities: null, strings: {}, plan: null };

const $ = (id) => document.getElementById(id);
const t = (key) => state.strings[key] || key;
const cityName = (c) => (state.lang === "zh" ? c.zh : c.en);
const cityAlt = (c) => (state.lang === "zh" ? c.en : c.zh);

function applyStrings() {
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const key = el.dataset.i18n;
    if (state.strings[key]) el.textContent = state.strings[key];
  });
  document.documentElement.lang = state.strings.html_lang || state.lang;
  document.title = t("brand");
  $("lang-en").setAttribute("aria-pressed", state.lang === "en" ? "true" : "false");
  $("lang-zh").setAttribute("aria-pressed", state.lang === "zh" ? "true" : "false");
}

function chip(city) {
  const on = state.selected.includes(city.key);
  const b = document.createElement("button");
  b.className = "chip";
  b.innerHTML = `${cityName(city)}${on ? ' <span class="x">×</span>' : ""}`;
  b.dataset.key = city.key;
  b.setAttribute("aria-pressed", on ? "true" : "false");
  b.onclick = () => toggle(city.key);
  return b;
}

function toggle(key) {
  const i = state.selected.indexOf(key);
  if (i >= 0) state.selected.splice(i, 1);
  else state.selected.push(key);
  renderChips();
  syncButton();
}

function renderChips() {
  const box = $("chips");
  box.innerHTML = "";
  const list = state.selected
    .map((k) => state.cities.all.find((c) => c.key === k))
    .filter(Boolean);
  const pool = [...list, ...state.cities.popular.filter((c) => !state.selected.includes(c.key))];
  pool.slice(0, 14).forEach((c) => box.appendChild(chip(c)));
}

function syncButton() {
  const ok = state.selected.length >= 2;
  $("go").disabled = !ok;
  if (ok) {
    const first = state.cities.all.find((c) => c.key === state.selected[0]);
    $("hint").textContent = t("hint_ready")
      .replace("{city}", cityName(first))
      .replace("{n}", state.selected.length);
  } else {
    $("hint").textContent = t("hint_need_two");
  }
}

async function loadCities() {
  const res = await fetch(`/api/inbound/cities?lang=${state.lang}`);
  state.cities = await res.json();
  state.strings = state.cities.strings || {};
  applyStrings();

  const more = $("more");
  more.innerHTML = `<option value="">${t("choose")}</option>`;
  state.cities.all.forEach((c) => {
    const o = document.createElement("option");
    o.value = c.key;
    o.textContent = `${cityName(c)} · ${cityAlt(c)} — ${c.region}`;
    more.appendChild(o);
  });
  more.onchange = () => {
    if (!more.value) return;
    if (!state.selected.includes(more.value)) state.selected.push(more.value);
    more.value = "";
    renderChips();
    syncButton();
  };

  // First load: preselect the three most popular cities so the button is live.
  if (!state.selected.length) {
    state.selected = state.cities.popular.slice(0, 3).map((c) => c.key);
  }
  renderChips();
  syncButton();
}

function fmt(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  if (state.lang === "zh") {
    if (h && mm) return `${h} 小时 ${mm} 分`;
    if (h) return `${h} 小时`;
    return `${mm} 分钟`;
  }
  return h ? `${h}h${String(mm).padStart(2, "0")}` : `${mm}min`;
}

function showLoading() {
  const out = $("out");
  out.className = "";
  out.classList.remove("hidden");
  out.innerHTML = `<div class="card"><div class="loading"><span class="spin"></span><span>${t("building")}</span></div></div>`;
  out.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderPlan(plan) {
  state.plan = plan;
  const out = $("out");
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  if (!plan.ok) {
    out.className = "";
    out.classList.remove("hidden");
    out.innerHTML = `<div class="card"><p>${esc(plan.error || "—")}</p></div>`;
    return;
  }
  const legs = plan.legs.map((l) => {
    const mode = l.mode === "train"
      ? (state.lang === "zh" ? "高铁" : "Train")
      : (state.lang === "zh" ? "航班" : "Flight");
    const book = l.booking_url
      ? `<a class="book" href="${l.booking_url}" target="_blank" rel="nofollow sponsored">${t("book")}</a>`
      : `<span class="d">—</span>`;
    return `<div class="leg">
      <div class="m">${mode}</div>
      <div>${l.from} → ${l.to}<small>${l.detail} · ${l.indicative ? t("estimated") : t("typ")}</small></div>
      <div style="text-align:right">${book}<div class="d" style="margin-top:4px">${fmt(l.duration_min)}</div></div>
    </div>`;
  }).join("");

  let lastCity = null;
  const days = plan.days.map((d) => {
    const isNew = d.city !== lastCity;
    lastCity = d.city;
    const hotel = isNew ? (plan.cities.find((c) => c.name === d.city) || {}).hotel_url : null;
    const items = d.items.map((i, idx, arr) => `
      <div class="item${idx === arr.length - 1 ? " last" : ""}">
        <div class="t">${i.time}</div>
        <div class="rail"><span class="dot"></span><span class="bar"></span></div>
        <div class="x">${i.title}<small>${i.detail || ""}</small></div>
      </div>`).join("");
    const hotelLink = hotel
      ? `<a class="hotel" href="${hotel}" target="_blank" rel="nofollow sponsored">${t("hotels")}</a>`
      : "";
    return `<div class="day">
      <div class="dh">
        <span class="dt">${d.date} ${d.weekday || ""}</span>
        <span class="ct">${d.city}<small>${state.lang === "zh" ? d.city_en : d.city_zh}</small></span>
        ${hotelLink}
      </div>
      ${items}
    </div>`;
  }).join("");

  const note = plan.affiliate_ready ? "" : `<div class="note">${t("no_booking_links")}</div>`;

  out.className = "result";
  out.classList.remove("hidden");
  out.innerHTML = `
    <div class="card">
      <h2>${plan.title}</h2>
      <div class="summary">
        <div>${t("meta_dates")}<b>${plan.start} → ${plan.end}</b></div>
        <div>${t("meta_stops")}<b>${plan.cities.length}</b></div>
        <div>${t("meta_distance")}<b>${plan.total_distance_km.toLocaleString()} km</b></div>
        <div class="tt">${t("total_travel")}<b>${fmt(plan.total_travel_minutes)}</b></div>
      </div>
      <p class="label" style="margin-top:16px">${t("getting_between")}</p>
      <div class="legs">${legs}</div>
      <p class="label" style="margin-top:8px">${t("day_by_day")}</p>
      ${days}
      ${note}
      <div class="actions">
        <button class="ghost" id="pdf">${t("open_print")}</button>
        <button class="ghost" id="ics">${t("download_ics")}</button>
        <button class="ghost" id="adjust">${t("adjust")}</button>
      </div>
    </div>`;

  $("pdf").onclick = () => {
    const q = new URLSearchParams({
      cities: state.selected.join(","),
      start: plan.start,
      days: plan.days.length,
      pace: plan.pace,
      lang: state.lang,
    });
    window.open(`/api/inbound/print?${q}`, "_blank");
  };
  $("ics").onclick = () => downloadIcs(plan);
  $("adjust").onclick = () => $("builder").scrollIntoView({ behavior: "smooth", block: "start" });
  out.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function downloadIcs(plan) {
  const res = await fetch("/api/export/ics", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ itinerary: plan }),
  });
  const text = await res.text();
  const url = URL.createObjectURL(new Blob([text], { type: "text/calendar" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = "china-itinerary.ics";
  a.click();
  URL.revokeObjectURL(url);
}

async function build() {
  $("go").disabled = true;
  showLoading();
  try {
    const res = await fetch("/api/inbound/plan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cities: state.selected,
        start: $("start").value,
        days: Number($("days").value),
        pace: $("pace").value,
        lang: state.lang,
      }),
    });
    renderPlan(await res.json());
  } catch (e) {
    renderPlan({ ok: false, error: String(e) });
  } finally {
    $("go").textContent = t("build");
    syncButton();
  }
}

$("go").onclick = build;

async function setLang(lang) {
  if (state.lang === lang) return;
  state.lang = lang;
  await loadCities();
  if (state.plan && state.plan.ok) build();
}

$("lang-en").onclick = () => setLang("en");
$("lang-zh").onclick = () => setLang("zh");

const d = new Date();
d.setDate(d.getDate() + 30);
$("start").value = d.toISOString().slice(0, 10);
$("go").textContent = t("build");
loadCities();
</script>
</body>
</html>
